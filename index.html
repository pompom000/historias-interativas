<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json"><title>StoryVerse — Histórias Interativas</title>
<style>
:root{--bg:#09090b;--panel:#111114;--panel2:#17171b;--line:#29292f;--text:#f7f7f8;--muted:#a6a6ad;--accent:#a855f7;--accent2:#7c3aed;--good:#22c55e;--danger:#ef4444}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh}button,input,textarea,select{font:inherit}button{border:0;color:var(--text);background:transparent;cursor:pointer}button:active{transform:scale(.98)}
.app{max-width:1180px;margin:auto;padding:0 18px 92px}.topbar{height:70px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20;background:rgba(9,9,11,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.04)}.brand{font-weight:850;font-size:21px;letter-spacing:-.6px;white-space:nowrap}.brand span{color:#c084fc}.top-search{flex:1;max-width:620px;margin:auto;position:relative}.top-search input{width:100%;background:#18181b;border:1px solid #27272a;border-radius:999px;color:#fff;padding:12px 16px 12px 42px;outline:none}.top-search input:focus{border-color:#6b21a8}.searchIcon{position:absolute;left:15px;top:10px;color:#8b8b94}.profile{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#9333ea,#4f46e5);display:grid;place-items:center;font-weight:800}
.nav{display:flex;gap:4px;align-items:center}.nav button{padding:10px 12px;border-radius:10px;color:#bbb}.nav button:hover,.nav button.active{background:#1b1b20;color:#fff}.mobileNav{display:none}
.hero{padding:38px 0 22px}.hero h1{font-size:38px;line-height:1.05;margin:0 0 10px;letter-spacing:-1.5px}.hero p{color:var(--muted);max-width:680px;margin:0;line-height:1.6}.section{margin-top:28px}.sectionHead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.sectionHead h2{font-size:20px;margin:0;letter-spacing:-.4px}.sectionHead button{color:#c084fc;font-size:14px}
.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 8px}.chip{padding:9px 14px;border:1px solid var(--line);background:#111114;border-radius:999px;color:#bdbdc5;white-space:nowrap}.chip.active{background:#5b21b6;border-color:#7c3aed;color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}.storyCard{cursor:pointer;transition:.18s}.storyCard:hover{transform:translateY(-2px);border-color:#3f3f46}.cover{height:145px;background:linear-gradient(135deg,#27123d,#171721);display:grid;place-items:center;font-size:54px;position:relative}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.45),transparent 60%)}.cover small{position:absolute;z-index:1;bottom:10px;left:11px;padding:5px 8px;border-radius:999px;background:rgba(0,0,0,.55);font-size:11px;color:#ddd}.heart{position:absolute;z-index:2;right:9px;top:9px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.5);display:grid;place-items:center;font-size:17px}.storyInfo{padding:13px}.storyInfo b{font-size:15px}.storyInfo p{font-size:12px;color:var(--muted);line-height:1.45;margin:7px 0 9px;min-height:34px}.tags{display:flex;gap:5px;flex-wrap:wrap}.tag{font-size:10px;color:#c8a7dc;background:#21152b;border-radius:999px;padding:4px 7px}
.banner{background:linear-gradient(110deg,#1c0c2b,#15151b 58%,#1e1230);border:1px solid #33203e;border-radius:20px;padding:24px;display:flex;justify-content:space-between;align-items:center;gap:20px}.banner h2{margin:0 0 7px;font-size:22px}.banner p{margin:0;color:#b8b0bd}.primary{background:linear-gradient(135deg,#9333ea,#6d28d9)!important;color:#fff!important;padding:12px 17px;border-radius:11px;font-weight:700}.secondary{background:#202025;padding:11px 15px;border-radius:11px;border:1px solid #303038}.empty{padding:45px 18px;text-align:center;border:1px dashed #33343a;border-radius:16px;color:#9b9ba3}.empty b{display:block;color:#eee;margin-bottom:7px}
.pageTitle{padding:30px 0 18px}.pageTitle h1{margin:0 0 7px;font-size:30px}.pageTitle p{margin:0;color:var(--muted)}.libraryTools{display:flex;gap:9px;margin-bottom:18px}.libraryTools input{flex:1}.field,textarea,select,input{background:#111114;color:#fff;border:1px solid #303038;border-radius:11px;padding:12px;outline:none}.field:focus,textarea:focus,select:focus,input:focus{border-color:#7c3aed}.editor{max-width:800px;margin:auto}.editor .card{padding:18px;margin:12px 0}.editor label{font-size:12px;color:#aaa;display:block;margin:4px 0}.editor textarea{width:100%;min-height:120px;resize:vertical}.editor input,.editor select{width:100%;margin-bottom:12px}.row{display:flex;gap:9px}.row>*{flex:1}.buttons{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}.sceneList{display:grid;gap:8px}.sceneBtn{padding:12px;text-align:left;background:#19191e;border:1px solid #2b2b31;border-radius:10px}.danger{border:1px solid #5a272c!important;color:#ff8d96!important;background:#231315!important}.choiceEditor{border:1px solid #2d2d34;border-radius:12px;padding:12px;margin:10px 0}.choiceEditor input,.choiceEditor select{margin-bottom:8px}
.detail{max-width:850px;margin:auto}.detailHero{display:flex;gap:22px;padding:28px 0}.detailCover{width:220px;height:260px;border-radius:18px;background:linear-gradient(135deg,#3b1466,#18181f);display:grid;place-items:center;font-size:80px;flex:none}.detail h1{font-size:34px;margin:8px 0}.detail .description{color:#b8b8c0;line-height:1.65}.detailActions{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.storyText{white-space:pre-wrap;line-height:1.8;color:#eee}.sceneTitle{font-size:25px;margin:9px 0 14px}.playWrap{max-width:760px;margin:auto}.playTop{display:flex;align-items:center;gap:10px;margin:22px 0}.playTop b{flex:1}.playCard{background:#111114;border:1px solid #2b2b31;border-radius:18px;padding:22px}.choiceBtn{display:block;width:100%;text-align:left;background:#19191e;border:1px solid #303038;padding:15px;border-radius:12px;margin-top:10px}.choiceBtn:hover{border-color:#7c3aed;background:#21172a}.backBtn{padding:9px 12px;border-radius:9px;background:#19191e;border:1px solid #2b2b31}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:grid;place-items:center;padding:18px}.modalBox{max-width:560px;width:100%;background:#141417;border:1px solid #33333a;border-radius:18px;padding:20px;max-height:90vh;overflow:auto}.modalBox h2{margin-top:0}.close{float:right;background:#24242a;border-radius:50%;width:34px;height:34px}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.nav{display:none}.topbar{height:62px}.brand{font-size:18px}.top-search{max-width:none}.profile{display:none}}
@media(max-width:650px){.app{padding:0 12px 84px}.hero{padding:28px 0 16px}.hero h1{font-size:31px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.cover{height:125px;font-size:44px}.storyInfo{padding:11px}.storyInfo p{font-size:11px}.banner{padding:18px;display:block}.banner .primary{margin-top:14px;width:100%}.detailHero{display:block}.detailCover{width:100%;height:190px}.detail h1{font-size:29px}.row{display:block}.row>*{width:100%;margin-bottom:9px}.mobileNav{display:flex;position:fixed;bottom:0;left:0;right:0;height:68px;background:rgba(12,12,15,.97);border-top:1px solid #27272c;z-index:40;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom)}.mobileNav button{font-size:11px;color:#999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:60px}.mobileNav button.active{color:#fff}.mobileNav span{font-size:19px}}
</style></head>
<body><div id="app"></div>
<script>
const KEY="storyverse_v2";
const starter=[
{id:"hotel",name:"A Última Porta",description:"Um hotel estranho, uma porta que não deveria existir e escolhas que mudam o destino.",tags:["Mistério","Sobrenatural","Suspense"],cover:"🚪",author:"StoryVerse",start:"start",scenes:{start:{title:"A batida na porta",text:"Você está no Hotel Hazbin. Depois de uma noite estranha, três batidas ecoam pela sua porta. O corredor está silencioso.",choices:[{text:"Abrir a porta",to:"hall"},{text:"Ignorar e procurar pistas",to:"library"}]},hall:{title:"O corredor",text:"Uma figura está parada no corredor. O sorriso parece esconder alguma coisa.",choices:[{text:"Perguntar o que aconteceu",to:"truth"},{text:"Segui-la em silêncio",to:"basement"}]},library:{title:"A biblioteca",text:"Entre livros antigos você encontra uma fotografia que mostra você diante de uma porta que não existe no hotel.",choices:[{text:"Examinar a fotografia",to:"truth"},{text:"Procurar outra saída",to:"basement"}]},basement:{title:"O porão",text:"Uma caixa metálica está sobre uma mesa. Dentro há uma chave marcada com 03:17.",choices:[{text:"Pegar a chave",to:"truth"}]},truth:{title:"A verdade",text:"A chave abre uma porta escondida. Do outro lado está exatamente o quarto onde você começou. A história parece estar se repetindo.",choices:[{text:"Continuar",to:"ending"},{text:"Voltar",to:"start"}]},ending:{title:"Final: o começo",text:"A porta se fecha. Você percebe que agora existe uma nova escolha escrita na parede: criar sua própria história.",choices:[{text:"Recomeçar",to:"start"}]}}},
{id:"moon",name:"A Cidade sob a Lua",description:"Uma cidade onde ninguém pode sair depois da meia-noite.",tags:["Fantasia","Aventura","Mistério"],cover:"🌙",author:"StoryVerse",start:"start",scenes:{start:{title:"Meia-noite",text:"O relógio marca 00:00. Todas as portas da cidade se fecham ao mesmo tempo.",choices:[{text:"Ir até a praça",to:"square"},{text:"Entrar na estação",to:"station"}]},square:{title:"A praça",text:"Uma estátua começa a falar seu nome.",choices:[{text:"Responder",to:"secret"}]},station:{title:"A estação",text:"Um trem vazio espera no trilho 7.",choices:[{text:"Entrar no trem",to:"secret"}]},secret:{title:"O segredo",text:"A cidade foi construída ao redor de uma promessa antiga. Agora você precisa decidir se vai quebrá-la.",choices:[{text:"Descobrir mais",to:"end"}]},end:{title:"Fim da noite",text:"O primeiro raio de sol aparece no horizonte.",choices:[]}}},
{id:"academy",name:"Academia dos Magos",description:"Você acaba de descobrir que possui um poder que ninguém consegue explicar.",tags:["Fantasia","Escola","Magia"],cover:"🔮",author:"StoryVerse",start:"start",scenes:{start:{title:"O primeiro dia",text:"As portas da academia se abrem e uma professora entrega a você uma chave dourada.",choices:[{text:"Perguntar sobre a chave",to:"class"},{text:"Esconder a chave",to:"garden"}]},class:{title:"A sala proibida",text:"Você descobre que a chave abre uma sala que não aparece nos mapas.",choices:[{text:"Usar a chave",to:"room"}]},garden:{title:"O jardim",text:"Uma criatura pequena observa você entre as flores.",choices:[{text:"Segui-la",to:"room"}]},room:{title:"A sala",text:"No centro existe um livro com seu nome na capa.",choices:[{text:"Abrir o livro",to:"end"}]},end:{title:"O livro",text:"A primeira página começa a escrever sozinha.",choices:[]}}},
{id:"detective",name:"Caso 17: O Quarto Vazio",description:"Um quarto trancado, uma testemunha desaparecida e uma pista deixada no espelho.",tags:["Investigação","Suspense","Crime"],cover:"🕵️",author:"StoryVerse",start:"start",scenes:{start:{title:"A cena",text:"O quarto está impecável, mas o espelho tem uma frase escrita por dentro.",choices:[{text:"Examinar o espelho",to:"mirror"},{text:"Procurar outra pista",to:"desk"}]},mirror:{title:"O espelho",text:"A frase diz: 'não confie no relógio'.",choices:[{text:"Olhar o relógio",to:"end"}]},desk:{title:"A mesa",text:"Há um recibo com o horário 03:17.",choices:[{text:"Comparar com o relógio",to:"end"}]},end:{title:"A pista",text:"As duas pistas apontam para o mesmo lugar.",choices:[]}}}
];
let db=JSON.parse(localStorage.getItem(KEY)||"null");
if(!db){db={stories:starter.map(s=>({...s,favorite:false,createdByMe:false}))};save()}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
const app=document.getElementById('app');let currentFilter='Todos';let currentQuery='';
const cats=['Todos','Mistério','Fantasia','Suspense','Aventura','Investigação','Romance','Terror','RPG'];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nav(active){return `<div class="topbar"><button class="brand" onclick="home()">Story<span>Verse</span></button><div class="top-search"><span class="searchIcon">⌕</span><input id="globalSearch" value="${esc(currentQuery)}" placeholder="Pesquisar histórias..." autocomplete="off"></div><div class="nav"><button class="${active==='home'?'active':''}" onclick="home()">Explorar</button><button class="${active==='library'?'active':''}" onclick="library()">Biblioteca</button><button class="${active==='mine'?'active':''}" onclick="mine()">Criar</button></div><div class="profile">S</div></div>`}
function mobileNav(active){return `<div class="mobileNav"><button class="${active==='home'?'active':''}" onclick="home()"><span>⌂</span>Início</button><button class="${active==='library'?'active':''}" onclick="library()"><span>▦</span>Biblioteca</button><button class="${active==='mine'?'active':''}" onclick="mine()"><span>＋</span>Criar</button></div>`}
function bindSearch(){const el=document.getElementById('globalSearch');if(el)el.oninput=e=>{currentQuery=e.target.value;renderContent()}}
function shell(active,content){app.innerHTML=`<div class="app">${nav(active)}${content}</div>${mobileNav(active)}`;bindSearch()}
function filtered(){return db.stories.filter(s=>{const q=currentQuery.trim().toLowerCase();const hay=[s.name,s.description,s.author,...(s.tags||[])].join(' ').toLowerCase();const cat=currentFilter==='Todos'||(currentFilter==='Favoritos' ? !!s.favorite : (s.tags||[]).includes(currentFilter));return cat&&(!q||hay.includes(q))})}
function card(s){const fav=s.favorite?'♥':'♡';return `<article class="card storyCard" onclick="detail('${esc(s.id)}')"><div class="cover"><span>${esc(s.cover||'📖')}</span><button class="heart" onclick="event.stopPropagation();toggleFav('${esc(s.id)}')">${fav}</button><small>${esc((s.tags||[])[0]||'História')}</small></div><div class="storyInfo"><b>${esc(s.name)}</b><p>${esc(s.description)}</p><div class="tags">${(s.tags||[]).slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div></article>`}
function renderContent(){const list=filtered();const grid=list.length?`<div class="grid">${list.map(card).join('')}</div>`:`<div class="empty"><b>Nenhuma história encontrada</b>Tente outro termo ou categoria.</div>`;document.getElementById('content').innerHTML=`<div class="chips">${cats.map(c=>`<button class="chip ${currentFilter===c?'active':''}" onclick="setFilter('${esc(c)}')">${esc(c)}</button>`).join('')}</div><div class="sectionHead"><h2>${currentQuery?'Resultados para “'+esc(currentQuery)+'”':'Descubra histórias'}</h2><button onclick="library()">Ver biblioteca →</button></div>${grid}`}
function home(){currentFilter='Todos';shell('home',`<section class="hero"><h1>Entre em uma nova história.</h1><p>Explore aventuras interativas, descubra novos mundos ou crie suas próprias rotas e finais.</p></section><section class="banner"><div><h2>Crie seu próprio universo</h2><p>Monte cenas, personagens, escolhas e caminhos diferentes.</p></div><button class="primary" onclick="newStory()">＋ Criar história</button></section><section class="section" id="content"></section>`);renderContent()}
function setFilter(c){currentFilter=c;renderContent()}
function library(){currentFilter='Todos';shell('library',`<section class="pageTitle"><h1>Biblioteca</h1><p>Todas as histórias salvas neste dispositivo.</p></section><div class="libraryTools"><input id="libSearch" value="${esc(currentQuery)}" placeholder="🔎 Pesquisar por título, gênero ou descrição..."><button class="secondary" onclick="currentFilter='Favoritos';library()">♥ Favoritos</button></div><div id="content"></div>`);const inp=document.getElementById('libSearch');inp.oninput=e=>{currentQuery=e.target.value;renderContent()};renderContent()}
function mine(){shell('mine',`<section class="pageTitle"><h1>Minhas histórias</h1><p>Crie, edite e teste suas próprias aventuras.</p></section><div class="buttons" style="margin-bottom:18px"><button class="primary" onclick="newStory()">＋ Nova história</button></div><div class="grid">${db.stories.filter(s=>s.createdByMe).map(card).join('')||`<div class="empty" style="grid-column:1/-1"><b>Você ainda não criou histórias.</b>Comece com uma nova aventura.</div>`}</div>`)}
function toggleFav(id){const s=db.stories.find(x=>x.id===id);if(s){s.favorite=!s.favorite;save();if(document.getElementById('content'))renderContent();else home()}}
function detail(id){const s=db.stories.find(x=>x.id===id);if(!s)return;app.innerHTML=`<div class="app"><div class="topbar"><button class="backBtn" onclick="home()">← Voltar</button><div class="brand">Story<span>Verse</span></div></div><div class="detail"><div class="detailHero"><div class="detailCover">${esc(s.cover||'📖')}</div><div><div class="tags">${(s.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><h1>${esc(s.name)}</h1><div class="description">${esc(s.description)}</div><div class="muted" style="margin-top:12px">por ${esc(s.author||'Você')}</div><div class="detailActions"><button class="primary" onclick="play('${esc(s.id)}')">▶ Jogar agora</button><button class="secondary" onclick="toggleFav('${esc(s.id)}');detail('${esc(s.id)}')">${s.favorite?'♥ Salvo':'♡ Salvar'}</button>${s.createdByMe?`<button class="secondary" onclick="editStory('${esc(s.id)}')">✎ Editar</button>`:''}</div></div></div><div class="card" style="padding:20px"><b>Sobre esta história</b><p class="muted">Escolha caminhos diferentes para descobrir cenas e finais. Você pode voltar e jogar novamente quantas vezes quiser.</p></div></div></div>`}
function play(id){const s=db.stories.find(x=>x.id===id);if(!s)return;let cur=s.start||Object.keys(s.scenes)[0];function render(){const x=s.scenes[cur];app.innerHTML=`<div class="app"><div class="playWrap"><div class="playTop"><button class="backBtn" onclick="detail('${esc(s.id)}')">←</button><b>${esc(s.name)}</b><button class="backBtn" onclick="home()">⌂</button></div><div class="playCard"><div class="tag">${esc(cur)}</div><div class="sceneTitle">${esc(x.title)}</div><div class="storyText">${esc(x.text)}</div><div>${(x.choices||[]).map((c,i)=>`<button class="choiceBtn" onclick="window.__choose(${i})">${esc(c.text)}</button>`).join('')||'<p class="muted">Fim desta rota.</p>'}</div></div></div></div>`;window.__choose=i=>{const to=x.choices[i].to;if(s.scenes[to]){cur=to;render()}else alert('Esta rota aponta para uma cena que não existe.')}}render()}
function newStory(){shell('mine',`<div class="editor"><div class="pageTitle"><h1>Nova história</h1><p>Comece criando o universo da sua aventura.</p></div><div class="card"><label>Nome</label><input id="name" placeholder="Ex.: A Casa Vermelha"><label>Descrição</label><textarea id="desc" placeholder="Conte em poucas linhas o que torna sua história interessante."></textarea><div class="row"><div><label>Emoji da capa</label><input id="cover" value="📖" maxlength="3"></div><div><label>Gêneros (separe por vírgula)</label><input id="tags" placeholder="Mistério, Terror"></div></div><div class="buttons"><button class="primary" id="go">Criar história</button><button class="secondary" onclick="home()">Cancelar</button></div></div></div>`);document.getElementById('go').onclick=()=>{const s={id:crypto.randomUUID(),name:document.getElementById('name').value.trim()||'Minha história',description:document.getElementById('desc').value.trim()||'Uma nova aventura.',tags:document.getElementById('tags').value.split(',').map(x=>x.trim()).filter(Boolean),cover:document.getElementById('cover').value||'📖',author:'Você',favorite:false,createdByMe:true,start:'inicio',scenes:{inicio:{title:'Início',text:'Comece sua história...',choices:[]}}};db.stories.push(s);save();editStory(s.id)}}
function editStory(id){const s=db.stories.find(x=>x.id===id);if(!s)return;const ids=Object.keys(s.scenes);shell('mine',`<div class="editor"><div class="pageTitle"><h1>Editar história</h1><p>${esc(s.name)}</p></div><div class="card"><label>Nome</label><input id="sn" value="${esc(s.name)}"><label>Descrição</label><textarea id="sd">${esc(s.description)}</textarea><div class="row"><div><label>Capa</label><input id="sc" value="${esc(s.cover||'📖')}"></div><div><label>Gêneros</label><input id="st" value="${esc((s.tags||[]).join(', '))}"></div></div><label>Cena inicial</label><select id="start">${ids.map(x=>`<option value="${esc(x)}" ${x===s.start?'selected':''}>${esc(x)}</option>`).join('')}</select><button class="primary" onclick="saveMeta('${esc(s.id)}')">Salvar dados</button></div><div class="card"><b>Cenas e rotas</b><div class="sceneList" style="margin-top:12px">${ids.map(id2=>`<button class="sceneBtn" onclick="editScene('${esc(s.id)}','${esc(id2)}')">${esc(id2)} — ${esc(s.scenes[id2].title)}</button>`).join('')}</div><div class="buttons"><button class="secondary" onclick="addScene('${esc(s.id)}')">＋ Nova cena</button><button class="primary" onclick="play('${esc(s.id)}')">▶ Testar</button></div></div><div class="buttons"><button class="secondary" onclick="detail('${esc(s.id)}')">Ver história</button><button class="danger" onclick="deleteStory('${esc(s.id)}')">Excluir história</button></div></div>`)}
function saveMeta(id){const s=db.stories.find(x=>x.id===id);s.name=document.getElementById('sn').value.trim()||s.name;s.description=document.getElementById('sd').value;s.cover=document.getElementById('sc').value||'📖';s.tags=document.getElementById('st').value.split(',').map(x=>x.trim()).filter(Boolean);s.start=document.getElementById('start').value;save();editStory(id)}
function addScene(id){const s=db.stories.find(x=>x.id===id);const name=prompt('ID da cena (sem espaços):');if(!name)return;if(s.scenes[name])return alert('Esse ID já existe.');s.scenes[name]={title:'Nova cena',text:'Escreva aqui...',choices:[]};save();editScene(id,name)}
function editScene(sid,cid){const s=db.stories.find(x=>x.id===sid),x=s.scenes[cid];shell('mine',`<div class="editor"><div class="pageTitle"><h1>Cena: ${esc(cid)}</h1><p>Crie o texto e conecte as escolhas.</p></div><div class="card"><label>Título</label><input id="ct" value="${esc(x.title)}"><label>Texto</label><textarea id="cb">${esc(x.text)}</textarea><b>Escolhas</b><div id="choices"></div><div class="buttons"><button class="secondary" id="addc">＋ Adicionar escolha</button><button class="primary" id="savec">Salvar cena</button><button class="danger" id="delc">Excluir cena</button></div></div></div>`);const box=document.getElementById('choices');function draw(){box.innerHTML=(x.choices||[]).map((c,i)=>`<div class="choiceEditor"><label>Texto da escolha</label><input data-q="${i}" value="${esc(c.text)}"><label>Vai para</label><select data-to="${i}">${Object.keys(s.scenes).map(k=>`<option value="${esc(k)}" ${k===c.to?'selected':''}>${esc(k)}</option>`).join('')}</select><button class="danger" onclick="removeChoice('${esc(sid)}','${esc(cid)}',${i})">Remover</button></div>`).join('')}draw();document.getElementById('addc').onclick=()=>{x.choices.push({text:'Nova escolha',to:cid});draw()};document.getElementById('savec').onclick=()=>{x.title=document.getElementById('ct').value;x.text=document.getElementById('cb').value;const qs=[...box.querySelectorAll('[data-q]')],ts=[...box.querySelectorAll('[data-to]')];x.choices=x.choices.map((c,i)=>({text:qs[i]?.value||c.text,to:ts[i]?.value||c.to}));save();editStory(sid)};document.getElementById('delc').onclick=()=>{if(Object.keys(s.scenes).length<=1)return alert('A história precisa de pelo menos uma cena.');if(confirm('Excluir esta cena?')){delete s.scenes[cid];if(s.start===cid)s.start=Object.keys(s.scenes)[0];save();editStory(sid)}}}
function removeChoice(sid,cid,i){const s=db.stories.find(x=>x.id===sid);s.scenes[cid].choices.splice(i,1);save();editScene(sid,cid)}
function deleteStory(id){if(confirm('Excluir esta história?')){db.stories=db.stories.filter(s=>s.id!==id);save();mine()}}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
home();
</script></body></html>
